<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS-ERP | Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1e388a;
    --blue: #2b57e8;
    --link: #2563eb;
    --ink: #0f172a;
    --label: #334155;
    --muted: #64748b;
    --placeholder: #94a3b8;
    --border: #cbd5e1;
    --card-border: #f1f5f9;
    --page-bg: #f8fafc;
  }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { text-decoration: none; color: inherit; }

  /* ---------- Header ---------- */
  .main-header {
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 48px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    position: relative;
    z-index: 2;
  }

  .brand { display: flex; align-items: center; }

  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-icon svg { width: 20px; height: 20px; display: block; }

  .brand-title {
    padding-left: 12px;
    font-size: 20px;
    line-height: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    white-space: nowrap;
  }

  .header-btn {
    display: inline-block;
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 6px;
    padding: 7px 21px;
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .header-btn:hover { background: rgba(255, 255, 255, 0.12); }

  /* ---------- Main ---------- */
  .main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    position: relative;
    z-index: 1;
  }

  .login-card {
    width: 100%;
    max-width: 430px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 41px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
  }

  .card-title {
    font-size: 24px;
    line-height: 32px;
    font-weight: 700;
    letter-spacing: -0.6px;
    color: var(--ink);
  }

  .auth-form { display: flex; flex-direction: column; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    color: var(--label);
  }

  .field input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    line-height: 17px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 15px 13px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field input::placeholder { color: var(--placeholder); opacity: 1; }

  .field input:focus {
    border-color: var(--link);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field input.invalid { border-color: #dc2626; }

  .field-error {
    font-size: 11px;
    line-height: 14px;
    color: #dc2626;
    min-height: 0;
  }

  .recovery-links {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 16px;
  }

  .recovery-links a {
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    color: var(--link);
    white-space: nowrap;
  }

  .recovery-links a:hover, .register-footer a:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    line-height: 20px;
    font-weight: 500;
    color: #fff;
    background: var(--blue);
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    transition: background 0.2s ease, opacity 0.2s ease;
  }

  .submit-btn:hover { background: #2049cc; }
  .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

  .form-message {
    display: none;
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    text-align: center;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .form-message.success { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .form-message.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

  .register-footer {
    display: flex;
    justify-content: center;
    gap: 2px;
    padding-top: 12px;
    font-size: 12px;
    line-height: 16px;
    text-align: center;
  }

  .register-footer span { color: var(--muted); }
  .register-footer a { color: var(--link); font-weight: 600; }

  /* ---------- Responsive ---------- */
  @media (max-width: 768px) {
    .main-header { padding: 12px 24px; }
    .main-content { padding: 32px 20px; }
  }

  @media (max-width: 480px) {
    .main-header { padding: 12px 16px; }
    .main-content { padding: 24px 16px; align-items: flex-start; }
    .login-card { padding: 28px 22px; gap: 22px; }
    .recovery-links { flex-wrap: wrap; row-gap: 6px; }
    .register-footer { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <header class="main-header">
    <a class="brand" href="#" aria-label="LMS-ERP home">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/>
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </span>
      <span class="brand-title">LMS-ERP</span>
    </a>
    <a class="header-btn" href="#">Sign up</a>
  </header>

  <main class="main-content">
    <section class="login-card">
      <h1 class="card-title">Log in</h1>

      <form class="auth-form" id="leadForm" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name">
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel">
          <span class="field-error" id="phoneError"></span>
        </div>

        <div class="recovery-links">
          <a href="#">Forgot username?</a>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Login</button>

        <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>

        <div class="register-footer">
          <span>Don’t have an account?</span>
          <a href="#">Sign up</a>
        </div>
      </form>
    </section>
  </main>

<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMyuz7b9Jr8ErssHTitVMZ5AGpK86mr2iqVIYxCxtA_KyQIs4Lk8ZF0BapwgKRn2eu/exec";

  var form = document.getElementById("leadForm");
  var submitBtn = document.getElementById("submitBtn");
  var formMessage = document.getElementById("formMessage");

  var fields = {
    name: document.getElementById("name"),
    email: document.getElementById("email"),
    phone: document.getElementById("phone")
  };

  // Keep placeholder links from jumping the page
  document.querySelectorAll('a[href="#"]').forEach(function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); });
  });

  function setError(key, msg) {
    document.getElementById(key + "Error").textContent = msg || "";
    fields[key].classList.toggle("invalid", !!msg);
  }

  function validate(values) {
    var ok = true;

    if (!values.name) { setError("name", "Please enter your name."); ok = false; }
    else setError("name", "");

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
      setError("email", "Please enter a valid email address."); ok = false;
    } else setError("email", "");

    if (!/^[+]?[0-9\s\-()]{7,15}$/.test(values.phone)) {
      setError("phone", "Please enter a valid phone number."); ok = false;
    } else setError("phone", "");

    return ok;
  }

  function showSuccess() {
    formMessage.className = "form-message success";
    formMessage.textContent = "Thank you! Your details have been submitted.";
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = "Login";
  }

  function showError() {
    formMessage.className = "form-message error";
    formMessage.textContent = "Something went wrong. Please try again.";
    submitBtn.disabled = false;
    submitBtn.textContent = "Login";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    formMessage.className = "form-message";
    formMessage.textContent = "";

    var name = fields.name.value.trim();
    var email = fields.email.value.trim();
    var phone = fields.phone.value.trim();

    if (!validate({ name: name, email: email, phone: phone })) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    var url = SCRIPT_URL + "?" + new URLSearchParams({ name: name, email: email, phone: phone });

    fetch(url, { method: "GET", mode: "no-cors" })
      .then(() => showSuccess())
      .catch(() => showError());
  });
</script>
</body>
</html>
